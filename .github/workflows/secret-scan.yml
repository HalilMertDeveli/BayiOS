name: secret-scan

# gitleaks (threat-model R6, RC-1 finding R-7 on #54). Complements GitHub secret scanning + push protection.
#   pull_request : the PR's commits (base..head), so a secret added and removed again inside the PR is still caught.
#   push / schedule / manual : the full git history.
# The binary is downloaded from the official release and verified against a pinned SHA-256 (no third-party action,
# no licence key). Findings are redacted in logs. Allowlist: .gitleaks.toml (exact synthetic values only).

on:
  pull_request:
  push:
    branches: [main, preview]
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  gitleaks:
    # Keep this name stable; ci-gate aggregates it.
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          "${RUNNER_TEMP}/gitleaks/gitleaks" version

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Scanning ${BASE_SHA}..${HEAD_SHA} ($(git rev-list --count "${BASE_SHA}..${HEAD_SHA}") commit(s))"
          "${RUNNER_TEMP}/gitleaks/gitleaks" git . --config .gitleaks.toml --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact --no-banner --verbose --exit-code 1

      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: |
          echo "Scanning full history ($(git rev-list --count HEAD) commit(s) reachable from HEAD)"
          "${RUNNER_TEMP}/gitleaks/gitleaks" git . --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1

      - name: How to fix a finding
        if: failure()
        run: |
          {
            echo "### gitleaks found a possible secret"
            echo "1. Treat it as leaked: revoke/rotate it at the provider first (the repo is public)."
            echo "2. Remove it from the branch (and history, if it reached main/preview) and use a GitHub/provider secret instead."
            echo "3. Only a documented synthetic test value may go into .gitleaks.toml (exact value, generic rule only)."
          } >> "$GITHUB_STEP_SUMMARY"
