name: ci-web

on:
  pull_request:
  push:
    branches: [main, preview]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  build-test:
    name: web lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: API types match contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5280
          # E2E has no Supabase: Playwright mocks Supabase Auth and the API at the network layer
          # (apps/web/e2e/support/mock-backend.ts). Public, non-secret placeholder values.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder-not-a-key

      # Threat-model §3.1 T / security audit 2026-11 rec. 4: no secret pattern in what the browser downloads. Only
      # .next/static — the server output holds Next's own per-build preview/server-action keys (never shipped).
      # Same pinned, checksum-verified binary and allowlist as secret-scan.yml.
      - name: Secret scan of the browser bundle (gitleaks, .next/static)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          "${RUNNER_TEMP}/gitleaks/gitleaks" dir .next/static --config ../../.gitleaks.toml \
            --redact --no-banner --verbose --exit-code 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke + accessibility (Playwright + axe)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
