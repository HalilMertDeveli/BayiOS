name: deploy-preview

# Preview deploy pipeline (issue #70, deploy-and-rollback.md §3/§5). Order: migration -> API -> web.
#   prepare     build the API image, generate + rehearse the idempotent EF scripts (infra/ci/ef-migrations.sh),
#               smoke the image locally. No secrets.
#   migrate     GitHub Environment `preview`: apply the scripts AS bayios_migrator (PREVIEW_MIGRATOR_CONNECTION),
#               then the posture check. Runs BEFORE the API is touched; a failure stops the pipeline.
#   deploy-api  push the image with an immutable tag (git SHA) to registry.fly.io and `flyctl deploy --image`
#               (FLY_API_TOKEN), then smoke /health, /health/ready, /api/v1/meta.
#   deploy-web  optional Vercel deploy hook (VERCEL_DEPLOY_HOOK_URL); otherwise Vercel's Git integration deploys.
#
# Safe without secrets: if the environment has none of the required secrets, every deploy step is skipped with
# "skipped: secrets missing" (green, nothing pushed/migrated/deployed). Half-configured => red, nothing deployed.
# Pull requests are a dry run: no environment, no deploy secrets, only `prepare` + the preflight report.
# Owner setup (names only): docs/operations/deploy-and-rollback.md §8.

on:
  push:
    branches: [preview]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "apps/mobile/**"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/deploy-preview.yml"
      - ".github/workflows/deploy-production.yml"
      - "infra/deploy/**"
      - "infra/ci/ef-migrations.sh"

permissions:
  contents: read

# Real deploys are serialised and never cancelled mid-migration; PR dry runs cancel each other per branch.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-preview-dry-run-{0}', github.ref) || 'deploy-preview' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: bayios-api:${{ github.sha }}

jobs:
  prepare:
    name: deploy prepare (image, migration scripts, local smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dry run::pull_request never deploys: no environment, no deploy secrets. Only image build, migration scripts and local smoke run."
          else
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: services/api/global.json

      - name: Generate idempotent migration scripts (and rehearse them on an empty Postgres 17)
        run: bash infra/ci/ef-migrations.sh
        env:
          OUT_DIR: ${{ runner.temp }}/migrations
          POSTGRES_PASSWORD: ci-local-only
          BAYIOS_APP_PASSWORD: ci-local-only
          BAYIOS_MIGRATOR_PASSWORD: ci-local-only

      - name: Build API image
        run: docker build --pull -t "$IMAGE" services/api

      - name: Local smoke (no DB/auth configured => live, not ready, environment Production)
        run: |
          docker run -d --name api-smoke -p 127.0.0.1:8080:8080 \
            --read-only --cap-drop ALL --security-opt no-new-privileges "$IMAGE"
          API_URL=http://127.0.0.1:8080 EXPECT_ENVIRONMENT=Production EXPECT_READY_STATUS=503 SMOKE_TIMEOUT=60 \
            bash infra/deploy/smoke.sh || { docker logs api-smoke; exit 1; }

      - name: Stop container
        if: always()
        run: docker rm -f api-smoke || true

      - name: Save image
        if: steps.mode.outputs.mode == 'deploy'
        run: docker save "$IMAGE" | gzip -1 > "${RUNNER_TEMP}/api-image.tar.gz"

      - name: Upload image
        if: steps.mode.outputs.mode == 'deploy'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-api-image-${{ github.run_id }}
          path: ${{ runner.temp }}/api-image.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload migration scripts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-migrations-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/migrations/*.sql
            ${{ runner.temp }}/migrations/manifest.txt
          if-no-files-found: error
          retention-days: 30

      # Same decision code as the real `migrate` job, fed with no secrets: shows what an environment without secrets
      # does ("skipped: secrets missing"). A PR never reads deploy secrets.
      - name: Deploy preflight (dry run, no secrets)
        if: steps.mode.outputs.mode == 'dry-run'
        env:
          ENVIRONMENT: preview
          REQUIRED: PREVIEW_MIGRATOR_CONNECTION FLY_API_TOKEN
          OPTIONAL: VERCEL_DEPLOY_HOOK_URL
        run: bash infra/deploy/preflight.sh

  migrate:
    name: migrate preview database (bayios_migrator)
    needs: prepare
    if: needs.prepare.outputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
      has_web_hook: ${{ steps.preflight.outputs.has_vercel_deploy_hook_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: infra

      - name: Preflight (which secrets are present; values never printed)
        id: preflight
        env:
          ENVIRONMENT: preview
          REQUIRED: PREVIEW_MIGRATOR_CONNECTION FLY_API_TOKEN
          OPTIONAL: VERCEL_DEPLOY_HOOK_URL
          PREVIEW_MIGRATOR_CONNECTION: ${{ secrets.PREVIEW_MIGRATOR_CONNECTION }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: bash infra/deploy/preflight.sh

      - name: Download migration scripts
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-migrations-${{ github.run_id }}
          path: ${{ runner.temp }}/migrations

      - name: Apply migrations as bayios_migrator, then posture check
        if: steps.preflight.outputs.ready == 'true'
        env:
          MIGRATOR_URL: ${{ secrets.PREVIEW_MIGRATOR_CONNECTION }}
          SCRIPTS_DIR: ${{ runner.temp }}/migrations
        run: |
          psql --version
          bash infra/deploy/apply-migrations.sh

  deploy-api:
    name: deploy preview API (Fly.io)
    needs: [prepare, migrate]
    if: needs.migrate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ steps.target.outputs.api_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: infra

      - name: Target
        id: target
        env:
          FLY_APP: ${{ vars.FLY_APP }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          app="${FLY_APP:-bayios-api-preview}"
          case "$app" in *[!a-z0-9-]*|"") echo "::error::invalid FLY_APP '${app}'"; exit 1 ;; esac
          {
            echo "app=${app}"
            echo "image=registry.fly.io/${app}:${GITHUB_SHA}"
            echo "api_url=${API_BASE_URL:-https://${app}.fly.dev}"
          } >> "$GITHUB_OUTPUT"

      - name: Download image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-api-image-${{ github.run_id }}
          path: ${{ runner.temp }}

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
        with:
          version: 0.5.5

      - name: Push immutable image (git SHA tag)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TARGET_IMAGE: ${{ steps.target.outputs.image }}
        run: |
          gunzip -c "${RUNNER_TEMP}/api-image.tar.gz" | docker load
          docker tag "$IMAGE" "$TARGET_IMAGE"
          flyctl auth docker
          docker push "$TARGET_IMAGE"

      - name: Deploy (rolling; Fly keeps the old release unless the new one passes /health)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ steps.target.outputs.app }}
          TARGET_IMAGE: ${{ steps.target.outputs.image }}
        run: |
          flyctl deploy --config infra/deploy/fly.preview.toml --app "$APP" --image "$TARGET_IMAGE" \
            --strategy rolling --wait-timeout 5m0s

      - name: Smoke (/health, /health/ready, /api/v1/meta = Preview)
        env:
          API_URL: ${{ steps.target.outputs.api_url }}
          EXPECT_ENVIRONMENT: Preview
        run: bash infra/deploy/smoke.sh

      - name: Rollback hint
        if: failure()
        env:
          APP: ${{ steps.target.outputs.app }}
        run: |
          {
            echo "### Preview API deploy failed"
            echo "The migration step already ran (expand/contract keeps the previous API compatible)."
            echo "Roll back by redeploying the previous image: \`flyctl releases --app ${APP} --image\`, then"
            echo "\`flyctl deploy --config infra/deploy/fly.preview.toml --app ${APP} --image registry.fly.io/${APP}:<previous-sha>\`"
            echo "(docs/operations/deploy-and-rollback.md §3)."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    name: deploy preview web (Vercel)
    needs: [migrate, deploy-api]
    if: needs.deploy-api.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    steps:
      - name: Trigger Vercel deploy hook
        if: needs.migrate.outputs.has_web_hook == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          # The hook URL is a secret (anyone holding it can deploy); only the job id is printed.
          response="$(curl -fsS -X POST --max-time 30 "$HOOK")"
          echo "Vercel deploy job: $(printf '%s' "$response" | grep -oE '"id":"[^"]+"' | head -n 1)"

      - name: No deploy hook
        if: needs.migrate.outputs.has_web_hook != 'true'
        run: |
          echo "::notice title=Web::skipped: VERCEL_DEPLOY_HOOK_URL not set; Vercel's Git integration deploys the preview branch on its own."
