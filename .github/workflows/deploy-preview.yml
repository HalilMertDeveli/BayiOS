name: deploy-preview

# Preview deploy pipeline (issues #70, #218; deploy-and-rollback.md §3/§5). Order: migration -> API -> web.
# Hosting (OD-12, free tiers only): API on Render (render.yaml, free, Frankfurt), web on Render too (bayios-web-preview; Vercel team blocked until 2026-12-05).
#   prepare   build the API image, generate + rehearse the idempotent EF scripts (infra/ci/ef-migrations.sh),
#             smoke the image locally. No secrets.
#   migrate   GitHub Environment `preview`: apply the scripts AS bayios_migrator (PREVIEW_MIGRATOR_CONNECTION),
#             then the posture check. A failure is a red check on the commit.
#   release   no push from CI: Render builds services/api/Dockerfile from the `preview` commit and, because of
#             `autoDeployTrigger: checksPass` (render.yaml), deploys it ONLY after every check on that commit is
#             green — including `migrate`. The web service (apps/web) follows the same rule.
#             This job only writes the hand-over summary (it cannot wait for Render: Render waits for it).
#   smoke     workflow_dispatch only: /health, /health/ready, /api/v1/meta = Preview against vars.API_BASE_URL.
#
# Safe without secrets: with no PREVIEW_MIGRATOR_CONNECTION, `migrate` ends green with "skipped: secrets missing"
# (nothing migrated; the API stays fail-closed without its bayios_app connection). Pull requests are a dry run:
# no environment, no deploy secrets. Owner setup (names only): docs/operations/deploy-and-rollback.md §8.

on:
  push:
    branches: [preview]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "apps/mobile/**"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/deploy-preview.yml"
      - ".github/workflows/deploy-production.yml"
      - "infra/deploy/**"
      - "infra/ci/ef-migrations.sh"
      - "render.yaml"

permissions:
  contents: read

# Real deploys are serialised and never cancelled mid-migration; PR dry runs cancel each other per branch.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-preview-dry-run-{0}', github.ref) || 'deploy-preview' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: bayios-api:${{ github.sha }}

jobs:
  prepare:
    name: deploy prepare (image, migration scripts, local smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dry run::pull_request never deploys: no environment, no deploy secrets. Only image build, migration scripts and local smoke run."
          else
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: services/api/global.json

      - name: Generate idempotent migration scripts (and rehearse them on an empty Postgres 17)
        run: bash infra/ci/ef-migrations.sh
        env:
          OUT_DIR: ${{ runner.temp }}/migrations
          POSTGRES_PASSWORD: ci-local-only
          BAYIOS_APP_PASSWORD: ci-local-only
          BAYIOS_MIGRATOR_PASSWORD: ci-local-only

      - name: Build API image
        run: docker build --pull -t "$IMAGE" services/api

      - name: Local smoke (no DB/auth configured => live, not ready, environment Production)
        run: |
          docker run -d --name api-smoke -p 127.0.0.1:8080:8080 \
            --read-only --cap-drop ALL --security-opt no-new-privileges "$IMAGE"
          API_URL=http://127.0.0.1:8080 EXPECT_ENVIRONMENT=Production EXPECT_READY_STATUS=503 SMOKE_TIMEOUT=60 \
            bash infra/deploy/smoke.sh || { docker logs api-smoke; exit 1; }

      - name: Stop container
        if: always()
        run: docker rm -f api-smoke || true

      - name: Upload migration scripts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-migrations-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/migrations/*.sql
            ${{ runner.temp }}/migrations/manifest.txt
          if-no-files-found: error
          retention-days: 30

      # Same decision code as the real `migrate` job, fed with no secrets: shows what an environment without secrets
      # does ("skipped: secrets missing"). A PR never reads deploy secrets.
      - name: Deploy preflight (dry run, no secrets)
        if: steps.mode.outputs.mode == 'dry-run'
        env:
          ENVIRONMENT: preview
          REQUIRED: PREVIEW_MIGRATOR_CONNECTION
        run: bash infra/deploy/preflight.sh

  migrate:
    name: migrate preview database (bayios_migrator)
    needs: prepare
    if: needs.prepare.outputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    outputs:
      ready: ${{ steps.preflight.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: infra

      - name: Preflight (which secrets are present; values never printed)
        id: preflight
        env:
          ENVIRONMENT: preview
          REQUIRED: PREVIEW_MIGRATOR_CONNECTION
          PREVIEW_MIGRATOR_CONNECTION: ${{ secrets.PREVIEW_MIGRATOR_CONNECTION }}
        run: bash infra/deploy/preflight.sh

      - name: Download migration scripts
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-migrations-${{ github.run_id }}
          path: ${{ runner.temp }}/migrations

      - name: Apply migrations as bayios_migrator, then posture check
        if: steps.preflight.outputs.ready == 'true'
        env:
          MIGRATOR_URL: ${{ secrets.PREVIEW_MIGRATOR_CONNECTION }}
          SCRIPTS_DIR: ${{ runner.temp }}/migrations
        run: |
          psql --version
          bash infra/deploy/apply-migrations.sh

  release:
    name: preview release hand-over (Render checksPass)
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summary
        env:
          READY: ${{ needs.migrate.outputs.ready }}
        run: |
          {
            echo "### Preview release"
            if [ "$READY" = true ]; then
              echo "- Migrations: applied as \`bayios_migrator\` and posture-checked."
            else
              echo "- Migrations: **skipped** (PREVIEW_MIGRATOR_CONNECTION not set) — DB-backed endpoints stay unavailable."
            fi
            echo "- API: Render deploys \`${GITHUB_SHA}\` once every check on it is green (render.yaml \`autoDeployTrigger: checksPass\`,"
            echo "  build filter \`services/api/**\`). Progress: Render Dashboard -> bayios-api-preview -> Events."
            echo "- Web: Render deploys bayios-web-preview (apps/web) under the same rule (build filter \`apps/web/**\`)."
            echo "- After the deploy: Actions -> deploy-preview -> Run workflow runs the \`smoke\` job."
            echo "- Rollback: docs/operations/deploy-and-rollback.md §3 (API) / §4 (web)."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: smoke preview API (Render)
    needs: migrate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: infra

      # A free Render instance sleeps when idle: the first request can take ~30-60 s, hence the long timeout.
      # Until ConnectionStrings__Default (bayios_app) is set on Render, /health/ready is 503 by design (fail-closed);
      # for that phase set the environment variable SMOKE_EXPECT_READY_STATUS=503.
      - name: Smoke (/health, /health/ready, /api/v1/meta = Preview)
        env:
          API_URL: ${{ vars.API_BASE_URL }}
          EXPECT_ENVIRONMENT: Preview
          EXPECT_READY_STATUS: ${{ vars.SMOKE_EXPECT_READY_STATUS || '200' }}
          SMOKE_TIMEOUT: "240"
        run: |
          [ -n "$API_URL" ] || { echo "::error::variable API_BASE_URL (environment preview) is not set"; exit 1; }
          bash infra/deploy/smoke.sh
