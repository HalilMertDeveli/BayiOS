name: ci-mobile-ios

# Unsigned iOS build of the Flutter app (apps/mobile, issue #45). The owner approved a macOS runner on 2026-11-09
# (GitHub-hosted macOS minutes are free for public repositories). It only proves the app compiles for iOS: no code
# signing, no Apple account, no secrets, nothing is distributed. Dart analyze/tests run once, in ci-mobile.yml (ubuntu).
# Path-filtered like ci-mobile: ci-gate (infra/ci/ci-gate.sh) waits for it when it runs and requires success.
# CocoaPods: ios/Podfile is generated by Flutter on the first build (the repo is developed on Windows); commit the
# generated Podfile + Podfile.lock once a Mac is available to lock pod versions.

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-mobile-ios.yml"
  push:
    branches: [main, preview]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-mobile-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  ios:
    # Keep this name stable.
    name: mobile ios build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
          pub-cache: true

      - name: Toolchain
        run: |
          xcodebuild -version
          pod --version
          flutter --version

      - name: Dependencies (locked)
        run: flutter pub get --enforce-lockfile

      - name: Localizations (gen-l10n)
        run: flutter gen-l10n

      - name: Build iOS (debug, simulator-independent, no code signing)
        run: flutter build ios --debug --no-codesign

      - name: Build iOS (release, no code signing)
        run: flutter build ios --release --no-codesign
