# BayiOS — nginx site (Ubuntu 24.04). Installed by infra/linux/bootstrap.sh to /etc/nginx/sites-available/bayios
# with __DOMAIN__ replaced, then enabled. This file is included inside nginx's `http { }` block.
#
#   https://<domain>/api/*   -> Kestrel   127.0.0.1:5080  (bayios-api.service)
#   https://<domain>/health* -> Kestrel   (liveness / readiness, used by deploy.sh and smoke.sh)
#   https://<domain>/*       -> Next.js   127.0.0.1:3000  (bayios-web.service)
#
# TLS: this file only listens on :80. `certbot --nginx -d <domain> --redirect` (see README) adds the
# `listen 443 ssl` + certificate lines to this server block and an http -> https redirect; renewal runs from
# certbot's systemd timer.
#
# Security headers: the apps already send their own (Next.js: CSP, X-Frame-Options, HSTS, ... in next.config.ts;
# API: nosniff, HSTS, no-store). nginx adds only what the API does not send, so no header is duplicated.

upstream bayios_api {
    server 127.0.0.1:5080;
    keepalive 16;
}

upstream bayios_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Coarse per-IP flood protection in front of the API. The API has its own per-user limits (ApiRateLimiting.cs).
limit_req_zone $binary_remote_addr zone=bayios_api_per_ip:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;

    # Excel/CSV import accepts up to 20 MB (ImportLimits.MaxFileBytes) + multipart overhead.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/problem+json application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location /api/ {
        limit_req zone=bayios_api_per_ip burst=40 nodelay;
        limit_req_status 429;

        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        proxy_pass http://bayios_api;
    }

    location = /health {
        proxy_pass http://bayios_api;
    }

    location /health/ {
        proxy_pass http://bayios_api;
    }

    location / {
        proxy_pass http://bayios_web;
    }
}
