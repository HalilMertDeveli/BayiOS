# BayiOS — Nginx site for the self-hosted Linux deployment (infra/linux/README.md).
# Installed as /etc/nginx/sites-available/bayios.conf by provision.sh, which replaces the placeholders
# app.example.com / api.example.com and the certificate directory /etc/letsencrypt/live/bayios.
#
#   https://app.example.com  ->  web (Next.js)      127.0.0.1:3200
#   https://api.example.com  ->  API (ASP.NET Core) 127.0.0.1:5280
#
# Security headers: the applications set their own (web: CSP, HSTS, X-Frame-Options, Referrer-Policy,
# Permissions-Policy, COOP via next.config.ts; API: nosniff, HSTS, Cache-Control no-store). Nginx deliberately adds
# none on proxied responses so there are no duplicate or conflicting values (two CSP headers intersect).

# WebSocket upgrade (SignalR/live updates); an empty Connection header otherwise, which keeps upstream keepalive.
map $http_upgrade $bayios_connection_upgrade {
    default upgrade;
    ""      "";
}

upstream bayios_web {
    server 127.0.0.1:3200;
    keepalive 16;
}

upstream bayios_api {
    server 127.0.0.1:5280;
    keepalive 16;
}

# Requests for any other Host (IP scans, spoofed Host headers) are dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Plain HTTP: ACME challenges (certbot), everything else -> HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com api.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Web app.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/bayios/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bayios/privkey.pem;
    include snippets/bayios-tls.conf;

    access_log /var/log/nginx/bayios-app.access.log;
    error_log  /var/log/nginx/bayios-app.error.log warn;

    # Form posts / server actions only; file uploads go to the API.
    client_max_body_size 2m;

    location / {
        proxy_pass http://bayios_web;
        include snippets/bayios-proxy.conf;
    }
}

# API.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/bayios/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bayios/privkey.pem;
    include snippets/bayios-tls.conf;

    access_log /var/log/nginx/bayios-api.access.log;
    error_log  /var/log/nginx/bayios-api.error.log warn;

    # Excel/CSV imports: the API accepts files up to 20 MB plus multipart overhead (ImportLimits.MaxFileBytes).
    client_max_body_size 25m;

    location / {
        proxy_pass http://bayios_api;
        include snippets/bayios-proxy.conf;
    }

    # Probes are frequent and carry no information worth keeping.
    location = /health {
        proxy_pass http://bayios_api;
        include snippets/bayios-proxy.conf;
        access_log off;
    }
}
