# BayiOS — TLS settings shared by the HTTPS server blocks (installed to /etc/nginx/snippets/).
# Mozilla "intermediate" profile. No OCSP stapling: Let's Encrypt stopped running OCSP responders in 2025.
# HTTP/2 is enabled on the listen lines: Ubuntu 24.04 ships Nginx 1.24, which predates `http2 on;`.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:BayiOS_TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
server_tokens off;
