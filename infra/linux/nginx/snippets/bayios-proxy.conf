# BayiOS — reverse proxy settings for a location block (installed to /etc/nginx/snippets/).
proxy_http_version 1.1;
proxy_set_header Host              $host;
# Overwrite (not append) X-Forwarded-For: Nginx is the only proxy, so a client-sent value must not be trusted.
# The API reads it via ASPNETCORE_FORWARDEDHEADERS_ENABLED=true (audit IP hash); Kestrel listens on 127.0.0.1 only.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $bayios_connection_upgrade;

proxy_connect_timeout 5s;
# Reports/exports can take a while; WebSockets send keep-alives well within this.
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# Compress text responses the upstream sent uncompressed (Next.js already compresses its own output).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/csv application/json application/problem+json application/javascript image/svg+xml;
