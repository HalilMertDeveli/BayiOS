# BayiOS — HTTP-only bootstrap site, used until the first certificate exists (infra/linux/README.md "TLS").
# provision.sh installs it as /etc/nginx/sites-available/bayios.conf when /etc/letsencrypt/live/bayios is missing,
# runs `certbot certonly --nginx --cert-name bayios -d app.example.com -d api.example.com`, then replaces it with
# bayios.conf. Nothing is proxied: the apps are only reachable over HTTPS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com api.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        default_type text/plain;
        return 503 "BayiOS: TLS certificate not issued yet\n";
    }
}
