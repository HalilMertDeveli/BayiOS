# Example OpenTelemetry Collector config for LOCAL trials (#55, docs/operations/observability.md §2). Nothing is sent
# anywhere: traces go to the collector's console (debug exporter), metrics are exposed for a local Prometheus on :8889.
# To use a hosted backend later, replace the exporters with that vendor's OTLP endpoint (API key via env, never here).
#
#   docker run --rm -p 4317:4317 -p 8889:8889 \
#     -v "$PWD/infra/ops/observability/otel-collector.example.yaml:/etc/otelcol-contrib/config.yaml:ro" \
#     otel/opentelemetry-collector-contrib:<pinned version>
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 dotnet run --project services/api/src/BayiOS.Api
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Defence in depth: drop attributes that must never be stored even if a future instrumentation adds them.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: url.query
        action: delete
      - key: enduser.email
        action: delete

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
