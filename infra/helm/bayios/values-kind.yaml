# kind (Kubernetes-in-Docker) overrides: in-cluster PostgreSQL + migration Job, ingress-nginx, one replica each.
# Used by .github/workflows/k8s-kind.yml and docs/operations/kubernetes.md. Throwaway local-only values — no secrets.
#
# What is NOT real here (by design): there is no Supabase Auth in the cluster. auth.authority points at a
# non-existent host, so /health/ready is green (config present) but any authenticated request is 401.
# Health, /api/v1/meta and the public web pages work end to end.

api:
  replicaCount: 1
  environment: Kind
  auth:
    authority: http://supabase-auth.kind.invalid/auth/v1
    requireHttpsMetadata: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }

web:
  replicaCount: 1
  resources:
    requests: { cpu: 25m, memory: 96Mi }

ingress:
  enabled: true
  className: nginx

postgres:
  enabled: true
  auth:
    postgresPassword: kind-local-only
    appPassword: kind-local-only
    migratorPassword: kind-local-only

dbMigrate:
  enabled: true
