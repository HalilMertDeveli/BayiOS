{{- if .Values.postgres.enabled }}
{{- $pg := .Values.postgres }}
{{- $pgPassword := required "postgres.auth.postgresPassword is required when postgres.enabled=true" $pg.auth.postgresPassword }}
{{- $appPassword := required "postgres.auth.appPassword is required when postgres.enabled=true" $pg.auth.appPassword }}
{{- $migratorPassword := required "postgres.auth.migratorPassword is required when postgres.enabled=true" $pg.auth.migratorPassword }}
# In-cluster PostgreSQL credentials (kind/dev only; values come from values-kind.yaml, never from git for real envs).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bayios.postgres.secretName" . }}
  labels:
    {{- include "bayios.labels" (dict "root" $ "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  BAYIOS_APP_PASSWORD: {{ $appPassword | quote }}
  BAYIOS_MIGRATOR_PASSWORD: {{ $migratorPassword | quote }}
---
# The API's connection string: runtime role bayios_app (NOBYPASSRLS, owns nothing) — never postgres.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bayios.api.dbSecretName" . }}
  labels:
    {{- include "bayios.labels" (dict "root" $ "component" "api") | nindent 4 }}
type: Opaque
stringData:
  ConnectionStrings__Default: {{ printf "Host=%s;Port=5432;Database=%s;Username=bayios_app;Password=%s" (include "bayios.postgres.host" .) $pg.database $appPassword | quote }}
{{- end }}
