apiVersion: v1
kind: Service
metadata:
  name: {{ include "bayios.fullname" . }}-api
  labels:
    {{- include "bayios.labels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "bayios.selectorLabels" (dict "root" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
{{- if .Values.web.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bayios.fullname" . }}-web
  labels:
    {{- include "bayios.labels" (dict "root" $ "component" "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "bayios.selectorLabels" (dict "root" $ "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
{{- end }}
