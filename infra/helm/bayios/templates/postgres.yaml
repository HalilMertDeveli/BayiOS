{{- if .Values.postgres.enabled }}
{{- $pg := .Values.postgres }}
# In-cluster PostgreSQL 17 for kind/dev ONLY: one replica, one PVC, no backups, no TLS, no HA.
# Roles (bayios_app / bayios_migrator), extensions and the schema are NOT created here: the db-migrate Job runs the
# repo's own bootstrap + migration scripts against this empty database (db-migrate-job.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bayios.postgres.host" . }}
  labels:
    {{- include "bayios.labels" (dict "root" $ "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "bayios.selectorLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bayios.postgres.host" . }}
  labels:
    {{- include "bayios.labels" (dict "root" $ "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "bayios.postgres.host" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "bayios.selectorLabels" (dict "root" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bayios.selectorLabels" (dict "root" $ "component" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999       # postgres user of the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "bayios.postgres.secretName" . }}
                  key: POSTGRES_PASSWORD
            # Subdirectory: the volume root may contain lost+found, which initdb refuses.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", {{ $pg.database | quote }}]
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $pg.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.storage.size }}
{{- end }}
