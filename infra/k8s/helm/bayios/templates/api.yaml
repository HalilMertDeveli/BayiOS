{{- if .Values.api.enabled }}
{{- $ctx := dict "ctx" $ "component" "api" }}
{{- if and (not .Values.api.secret.existingSecret) (not .Values.api.secret.create) }}
{{- fail "api.secret: set create=true or name an existingSecret" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bayios.fullname" . }}-api
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
data:
  ASPNETCORE_HTTP_PORTS: {{ .Values.api.containerPort | quote }}
  {{- range $key, $value := .Values.api.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- if and .Values.api.secret.create (not .Values.api.secret.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bayios.fullname" . }}-api
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  {{- $values := deepCopy .Values.api.secret.values }}
  {{- if and .Values.postgres.enabled (not $values.ConnectionStrings__Default) (not .Values.postgres.auth.existingSecret) }}
  {{- $_ := set $values "ConnectionStrings__Default" (printf "Host=%s;Port=5432;Database=%s;Username=bayios_app;Password=%s" (include "bayios.postgres.fullname" .) .Values.postgres.database (required "postgres.auth.appPassword is required when postgres.enabled=true" .Values.postgres.auth.appPassword)) }}
  {{- end }}
  {{- range $key, $value := $values }}
  {{- if $value }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bayios.fullname" . }}-api
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "bayios.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bayios.fullname" . }}-api
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "bayios.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bayios.labels" $ctx | nindent 8 }}
      annotations:
        # Roll the pods when settings change (Secret content is not hashed: it may be managed outside the chart).
        checksum/config: {{ toYaml .Values.api.config | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "bayios.podSecurityContext" (dict "ctx" $ "component" .Values.api.podSecurityContext) | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "bayios.image" (dict "ctx" $ "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "bayios.fullname" . }}-api
            - secretRef:
                name: {{ include "bayios.api.secretName" . }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.api.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.affinity }}
      affinity:
        {{- toYaml .Values.api.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "bayios.selectorLabels" $ctx | nindent 20 }}
      {{- end }}
{{- if and .Values.api.podDisruptionBudget.enabled (gt (int .Values.api.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "bayios.fullname" . }}-api
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "bayios.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
