{{- if .Values.web.enabled }}
{{- $ctx := dict "ctx" $ "component" "web" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bayios.fullname" . }}-web
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
data:
  PORT: {{ .Values.web.containerPort | quote }}
  HOSTNAME: "0.0.0.0"
  {{- range $key, $value := .Values.web.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bayios.fullname" . }}-web
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "bayios.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bayios.fullname" . }}-web
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "bayios.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bayios.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.web.config | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "bayios.podSecurityContext" (dict "ctx" $ "component" .Values.web.podSecurityContext) | nindent 8 }}
      containers:
        - name: web
          image: {{ include "bayios.image" (dict "ctx" $ "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "bayios.fullname" . }}-web
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with .Values.web.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only; Next.js writes its ISR/image cache here.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.web.affinity }}
      affinity:
        {{- toYaml .Values.web.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "bayios.selectorLabels" $ctx | nindent 20 }}
      {{- end }}
{{- if and .Values.web.podDisruptionBudget.enabled (gt (int .Values.web.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "bayios.fullname" . }}-web
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "bayios.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
