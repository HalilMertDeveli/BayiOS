{{- if .Values.postgres.enabled }}
{{- /* Local/CI only: single instance, no backups, no HA. Production uses managed Supabase PostgreSQL. */}}
{{- $ctx := dict "ctx" $ "component" "postgres" }}
{{- if not .Values.postgres.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bayios.postgres.fullname" . }}
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "postgres.auth.postgresPassword is required when postgres.enabled=true" .Values.postgres.auth.postgresPassword | quote }}
  app-password: {{ required "postgres.auth.appPassword is required when postgres.enabled=true" .Values.postgres.auth.appPassword | quote }}
  migrator-password: {{ required "postgres.auth.migratorPassword is required when postgres.enabled=true" .Values.postgres.auth.migratorPassword | quote }}
{{- end }}
---
# Same bootstrap as infra/docker/initdb (roles bayios_migrator / bayios_app). Copies live in files/initdb;
# ci-k8s.yml fails if they drift from infra/docker/initdb.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bayios.postgres.fullname" . }}-initdb
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
data:
  {{- (.Files.Glob "files/initdb/*").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bayios.postgres.fullname" . }}
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "bayios.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bayios.postgres.fullname" . }}
  labels:
    {{- include "bayios.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ include "bayios.postgres.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "bayios.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bayios.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "bayios.podSecurityContext" (dict "ctx" $ "component" (dict "runAsUser" 70 "runAsGroup" 70 "fsGroup" 70)) | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "bayios.postgres.secretName" . }}, key: postgres-password } }
            - name: BAYIOS_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "bayios.postgres.secretName" . }}, key: app-password } }
            - name: BAYIOS_MIGRATOR_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "bayios.postgres.secretName" . }}, key: migrator-password } }
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          startupProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", {{ .Values.postgres.database | quote }}] }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", {{ .Values.postgres.database | quote }}] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: initdb
          configMap:
            name: {{ include "bayios.postgres.fullname" . }}-initdb
            defaultMode: 0555
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
