{{- if .Values.networkPolicy.enabled }}
{{- /* Ingress rules only: egress stays open (the API needs Supabase Auth JWKS, the AI provider, OTLP...). */}}
{{- if .Values.api.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bayios.fullname" . }}-api
  labels:
    {{- include "bayios.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bayios.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
{{- end }}
{{- if .Values.web.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bayios.fullname" . }}-web
  labels:
    {{- include "bayios.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bayios.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
{{- end }}
{{- if .Values.postgres.enabled }}
---
# PostgreSQL accepts connections only from the API pods and the migration Job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bayios.postgres.fullname" . }}
  labels:
    {{- include "bayios.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bayios.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "bayios.selectorLabels" (dict "ctx" $ "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "bayios.selectorLabels" (dict "ctx" $ "component" "migrations") | nindent 14 }}
      ports:
        - port: postgres
          protocol: TCP
{{- end }}
{{- end }}
