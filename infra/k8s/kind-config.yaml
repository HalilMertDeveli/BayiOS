# kind cluster for the BayiOS Kubernetes rehearsal (docs/operations/kubernetes.md, .github/workflows/k8s-kind.yml).
# One control-plane node labelled for ingress-nginx; the controller's port 80 is published on 127.0.0.1:8088 only,
# so the web app is reachable at http://localhost:8088 (the same URL the web image is built with).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8088
        listenAddress: "127.0.0.1"
        protocol: TCP
