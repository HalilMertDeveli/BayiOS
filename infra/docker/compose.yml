# Local development only. Never point this at preview/production data.
name: bayios

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bayios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bayios"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
