# BayiOS — Render Blueprint: PREVIEW API only (issue #218, decision OD-12: free tiers only).
#
# One free web service built from services/api/Dockerfile, Frankfurt (same city as Supabase eu-central-1),
# deployed from the `preview` branch. Production is NOT described here and is never deployed from this file.
# Docs: docs/operations/deploy-and-rollback.md §3, docs/operations/environments.md §2.
#
# Order (unchanged rule: migration -> API -> web): `autoDeployTrigger: checksPass` makes Render deploy a `preview`
# commit only after every GitHub check on it is green, including the `migrate preview database (bayios_migrator)`
# job of .github/workflows/deploy-preview.yml. A failed migration (red check) therefore never reaches the API.
#
# Secrets are NEVER written here. `sync: false` = the value is entered once in the Render Dashboard
# (service -> Environment), never in git. The API starts without them but stays fail-closed:
# /health = 200, /health/ready = 503, data endpoints refuse to work.
#   ConnectionStrings__Default -> bayios_app role ONLY (NOBYPASSRLS, not table owner); never postgres/service_role.
#                                 Supabase session pooler, port 5432, `SSL Mode=Require`.
#   Auth__Authority            -> https://<supabase-project-ref>.supabase.co/auth/v1 (not secret, project-specific)
#   Cors__AllowedOrigins__0    -> the preview web origin on Vercel (not secret, project-specific)
# NOT on the API: ConnectionStrings__Migrator / bayios_migrator (used only by the CI migration step).
#
# Free plan limits: the instance sleeps after ~15 min idle; the first request then takes ~30-60 s (cold start).
# The background worker (outbox, jobs) only runs while the instance is awake — acceptable for preview only.

services:
  - type: web
    name: bayios-api-preview
    runtime: docker
    plan: free
    region: frankfurt
    branch: preview
    dockerContext: ./services/api
    dockerfilePath: ./services/api/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - services/api/**
        - render.yaml
      ignoredPaths:
        - services/api/tests/**
        - "**/*.md"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Preview
      # The image listens on 8080 (ASPNETCORE_HTTP_PORTS); tells Render which port to route to.
      - key: PORT
        value: "8080"
      - key: Auth__Audience
        value: authenticated
      - key: Auth__Authority
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: ConnectionStrings__Default
        sync: false
      # HMAC key for audit IP hashes (>= 32 bytes). Generated by Render, never seen by anyone.
      - key: Audit__IpHashKey
        generateValue: true
