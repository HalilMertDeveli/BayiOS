# BayiOS — Render Blueprint: PREVIEW only (issue #218, decision OD-12: free tiers only).
#
# Two free web services in Frankfurt (same city as Supabase eu-central-1), deployed from the `preview` branch:
#   bayios-api-preview  services/api/Dockerfile
#   bayios-web-preview  apps/web (Next.js, `next start`). The web runs here because the Vercel Hobby team is blocked
#                       (fair use) until 2026-12-05; apps/web/vercel.json stays so it can move back to Vercel later.
# Production is NOT described here and is never deployed from this file.
# Docs: docs/operations/deploy-and-rollback.md §3, docs/operations/environments.md §2.
#
# Order (unchanged rule: migration -> API -> web): `autoDeployTrigger: checksPass` makes Render deploy a `preview`
# commit only after every GitHub check on it is green, including the `migrate preview database (bayios_migrator)`
# job of .github/workflows/deploy-preview.yml. A failed migration (red check) therefore never reaches the API.
#
# Secrets are NEVER written here. `sync: false` = the value is entered once in the Render Dashboard
# (service -> Environment), never in git. The API starts without them but stays fail-closed:
# /health = 200, /health/ready = 503, data endpoints refuse to work.
#   ConnectionStrings__Default -> bayios_app role ONLY (NOBYPASSRLS, not table owner); never postgres/service_role.
#                                 Supabase session pooler, port 5432, `SSL Mode=Require`.
#   Auth__Authority            -> https://<supabase-project-ref>.supabase.co/auth/v1 (not secret, project-specific)
#   Cors__AllowedOrigins__0    -> the preview web origin, https://<bayios-web-preview>.onrender.com (not secret)
# NOT on the API: ConnectionStrings__Migrator / bayios_migrator (used only by the CI migration step).
#
# Free plan limits: an instance sleeps after ~15 min idle; the first request then takes ~30-60 s (cold start).
# The 750 free instance hours per month are shared by ALL services of the workspace (API + web).
# The background worker (outbox, jobs) only runs while the instance is awake — acceptable for preview only.

services:
  - type: web
    name: bayios-api-preview
    runtime: docker
    plan: free
    region: frankfurt
    branch: preview
    dockerContext: ./services/api
    dockerfilePath: ./services/api/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - services/api/**
        - render.yaml
      ignoredPaths:
        - services/api/tests/**
        - "**/*.md"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Preview
      # The image listens on 8080 (ASPNETCORE_HTTP_PORTS); tells Render which port to route to.
      - key: PORT
        value: "8080"
      - key: Auth__Audience
        value: authenticated
      - key: Auth__Authority
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: ConnectionStrings__Default
        sync: false
      # HMAC key for audit IP hashes (>= 32 bytes). Generated by Render, never seen by anyone.
      - key: Audit__IpHashKey
        generateValue: true

  - type: web
    name: bayios-web-preview
    runtime: node
    plan: free
    region: frankfurt
    branch: preview
    buildCommand: cd apps/web && npm ci && npm run build
    startCommand: cd apps/web && npm run start
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/web/**
        - packages/contracts/**
        - render.yaml
      ignoredPaths:
        - apps/web/e2e/**
        - apps/web/e2e-local/**
        - "**/*.md"
    # NEXT_PUBLIC_* are baked into the bundle at BUILD time and are public — never put a secret here.
    # A changed value needs a redeploy.
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Optional, public Cloudflare Turnstile site key (CAPTCHA). Empty = CAPTCHA off.
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
