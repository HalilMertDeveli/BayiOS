name: bayios_mobile
description: "BayiOS Depo — depo personeli için mobil uygulama (Android/iOS)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Exact versions on purpose (no caret): upgrades are explicit PRs (ADR 0011). pubspec.lock is committed.
dependencies:
  connectivity_plus: 7.3.2
  dio: 5.11.1
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.5.0
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.4
  go_router: 18.1.3
  google_fonts: 8.2.1
  intl: 0.20.3
  mobile_scanner: 7.5.0
  supabase_flutter: 2.18.3
  uuid: 4.6.0

dev_dependencies:
  # `flutter drive` screenshot driver (test_driver/integration_test.dart).
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # MockClient for the real GoTrue client in token-refresh tests.
  http: 1.6.0
  integration_test:
    sdk: flutter
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Kit icons (24×24 SVG, currentColor) — lib/core/theme/app_icon.dart.
    - assets/icons/
    # Inter Tight (SIL OFL 1.1, assets/google_fonts/OFL.txt), bundled so
    # google_fonts never fetches at runtime (offline handhelds, tests).
    - assets/google_fonts/
