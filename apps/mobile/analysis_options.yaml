# Strict lints (ADR 0011): very_good_analysis + strict language modes.
# `flutter analyze` must report no issues (CI fails on any info/warning/error).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    # Generated by gen-l10n (git-ignored).
    - lib/l10n/app_localizations*.dart
    # Generated by packages/design-tokens/build.mjs from the kit token JSON.
    - lib/core/theme/app_palette.dart
    - android/**
    - ios/**

linter:
  rules:
    # App code, not a published package: doc comments where they help, not on
    # every public member.
    public_member_api_docs: false
    # Dart 3.13 `new(...)` constructor shorthand: keep the conventional
    # `ClassName(...)` form used by the Flutter docs and examples.
    unnecessary_type_name_in_constructor: false
