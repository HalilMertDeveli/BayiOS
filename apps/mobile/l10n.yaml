# Turkish UI strings (flutter_localizations + gen-l10n). The generated Dart
# files are git-ignored; `flutter pub get` / `flutter gen-l10n` regenerate
# them from lib/l10n/app_tr.arb.
arb-dir: lib/l10n
template-arb-file: app_tr.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
